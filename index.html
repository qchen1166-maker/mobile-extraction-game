<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>撤离行动 · 原型 0.1</title>
<style>
:root{color-scheme:dark;--bg:#101820;--panel:#1b2933;--line:#40515e;--accent:#b6e35a;--danger:#ff6868;--text:#f1f5f7;--muted:#aab7c0}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:var(--text);touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:relative;width:100%;height:100%;height:100dvh;overflow:hidden;background:radial-gradient(ellipse at center,#1a2b32 0%,#101820 75%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 12px)}
.topbar{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.stat{background:#101820d9;border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:88px;backdrop-filter:blur(6px)}.stat small{display:block;color:var(--muted);font-size:11px}.stat strong{font-size:16px}.health-wrap{width:min(36vw,180px);height:8px;border-radius:99px;background:#3a2026;overflow:hidden;margin-top:5px}.health{height:100%;width:100%;background:var(--danger);transition:width .12s}
#hint{position:absolute;top:92px;left:50%;transform:translateX(-50%);text-align:center;color:#d4e0e6;font-size:12px;text-shadow:0 2px 4px #000;white-space:nowrap;background:#101820a8;padding:6px 10px;border-radius:8px}
#controls{position:absolute;inset:0;pointer-events:none}.joystick{position:absolute;left:22px;bottom:calc(env(safe-area-inset-bottom) + 25px);width:122px;height:122px;border-radius:50%;background:#d9e6ee16;border:2px solid #d9e6ee55;pointer-events:auto;touch-action:none}.stick{position:absolute;width:48px;height:48px;border-radius:50%;left:35px;top:35px;background:#d9e6ee99;border:2px solid #fff9;box-shadow:0 3px 10px #0006}.fire{position:absolute;right:24px;bottom:calc(env(safe-area-inset-bottom) + 38px);width:88px;height:88px;border-radius:50%;border:2px solid #ffb2a8;background:#e64f4566;color:white;font-weight:800;font-size:16px;pointer-events:auto;touch-action:none;box-shadow:0 0 0 7px #e64f4520}.fire:active{background:#ff5b4cbb}.reload{position:absolute;right:32px;bottom:calc(env(safe-area-inset-bottom) + 137px);pointer-events:auto;border:1px solid #d9e6ee77;border-radius:10px;background:#101820dd;color:white;padding:9px 12px;font-size:12px;touch-action:manipulation}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:#081016b8;backdrop-filter:blur(5px);z-index:5}.card{width:min(440px,100%);border:1px solid #52616a;background:linear-gradient(160deg,#22323b,#111a20);border-radius:20px;padding:24px;box-shadow:0 20px 70px #0009}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:800}.card h1{font-size:30px;line-height:1.1;margin:10px 0}.card p{color:#c1cdd4;line-height:1.65;font-size:14px}.features{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0}.pill{border:1px solid #50616b;color:#d8e2e8;border-radius:99px;padding:6px 9px;font-size:11px}.primary{width:100%;border:0;border-radius:12px;background:var(--accent);color:#17200b;font-size:16px;font-weight:900;padding:14px;cursor:pointer}.secondary{width:100%;margin-top:9px;border:1px solid #63727b;border-radius:12px;background:#18252d;color:white;font-size:14px;padding:12px;cursor:pointer}.hidden{display:none!important}.footnote{font-size:11px!important;color:#93a4ae!important;margin-bottom:0}
@media(min-width:760px){.joystick{left:35px;bottom:28px}.fire{right:36px;bottom:38px}.reload{right:45px;bottom:140px}#hint{top:100px}}
</style>
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="撤离行动游戏画面"></canvas>
  <div id="hud" class="hidden">
    <div class="topbar">
      <div class="stat"><small>生命值</small><strong id="hpText">100 / 100</strong><div class="health-wrap"><div id="healthBar" class="health"></div></div></div>
      <div class="stat"><small>本局击败</small><strong id="killsText">0 / 10</strong></div>
      <div class="stat"><small>弹药</small><strong id="ammoText">12 / 60</strong></div>
    </div>
    <div id="hint">移动：左侧摇杆 · 射击：右侧按钮</div>
  </div>
  <div id="controls" class="hidden">
    <div id="joystick" class="joystick" aria-label="移动摇杆"><div id="stick" class="stick"></div></div>
    <button id="reload" class="reload">换弹 R</button>
    <button id="fire" class="fire">开火</button>
  </div>
  <section id="startScreen" class="overlay"><div class="card">
    <div class="eyebrow">MOBILE EXTRACTION · PROTOTYPE 0.1</div><h1>撤离行动</h1>
    <p>进入危险区域，击败来袭敌人。先熟悉移动与射击，撑过这一轮训练。</p>
    <div class="features"><span class="pill">俯视角射击</span><span class="pill">触屏操作</span><span class="pill">敌人追击 AI</span><span class="pill">胜负结算</span></div>
    <button id="startBtn" class="primary">开始行动</button>
    <p class="footnote">原型版本：暂未加入真实撤离、背包、掉落和联网功能。</p>
  </div></section>
  <section id="endScreen" class="overlay hidden"><div class="card">
    <div id="endEyebrow" class="eyebrow">MISSION REPORT</div><h1 id="endTitle">行动结束</h1><p id="endDesc">本局结果</p>
    <div class="features"><span class="pill" id="endKills">击败敌人：0</span><span class="pill" id="endTime">用时：0 秒</span></div>
    <button id="againBtn" class="primary">再来一局</button><button id="menuBtn" class="secondary">返回主菜单</button>
  </div></section>
</div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const ui = {hud:$('hud'),controls:$('controls'),start:$('startScreen'),end:$('endScreen'),hp:$('hpText'),bar:$('healthBar'),kills:$('killsText'),ammo:$('ammoText'),hint:$('hint'),endTitle:$('endTitle'),endDesc:$('endDesc'),endKills:$('endKills'),endTime:$('endTime'),endEyebrow:$('endEyebrow')};
  const TARGET_KILLS = 10, MAG_SIZE = 12, START_RESERVE = 60;
  let W=innerWidth,H=innerHeight,dpr=1,state='menu',last=0,elapsed=0,spawnClock=0,shootClock=0,reloadClock=0,damageFlash=0;
  let player,enemies=[],bullets=[],enemyBullets=[],particles=[],obstacles=[],kills=0,ammo=MAG_SIZE,reserve=START_RESERVE;
  const keys = new Set();
  const joy = {active:false,id:null,x:0,y:0,dx:0,dy:0};
  let firing=false,mouseAim=null;
  const rand=(a,b)=>a+Math.random()*(b-a);
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  function resize(){
    W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);
    if(player){player.x=clamp(player.x,22,W-22);player.y=clamp(player.y,22,H-22);}
    buildObstacles();
  }
  function buildObstacles(){
    obstacles=[];const count=Math.max(5,Math.floor(W*H/55000));
    for(let i=0;i<count;i++){const w=rand(35,75),h=rand(28,62),x=rand(20,Math.max(21,W-w-20)),y=rand(120,Math.max(121,H-h-150));if(player&&Math.hypot(x+w/2-player.x,y+h/2-player.y)<115)continue;obstacles.push({x,y,w,h});}
  }
  function reset(){
    player={x:W/2,y:H/2,r:13,hp:100,maxHp:100,speed:205,angle:0,invuln:0};
    enemies=[];bullets=[];enemyBullets=[];particles=[];kills=0;ammo=MAG_SIZE;reserve=START_RESERVE;elapsed=0;spawnClock=.4;shootClock=0;reloadClock=0;damageFlash=0;firing=false;mouseAim=null;joy.dx=joy.dy=0;
    buildObstacles();updateHud();
  }
  function showGame(){ui.start.classList.add('hidden');ui.end.classList.add('hidden');ui.hud.classList.remove('hidden');ui.controls.classList.remove('hidden');}
  function start(){reset();state='playing';showGame();last=performance.now();requestAnimationFrame(loop);}
  function end(win){if(state!=='playing')return;state=win?'won':'lost';firing=false;ui.controls.classList.add('hidden');ui.end.classList.remove('hidden');ui.endEyebrow.textContent=win?'MISSION COMPLETE':'MISSION FAILED';ui.endTitle.textContent=win?'区域已清空！':'行动失败';ui.endDesc.textContent=win?'你成功击败了 10 名敌人。本阶段的核心战斗循环已完成。':'你已失去全部生命值。调整走位，再尝试一次。';ui.endKills.textContent='击败敌人：'+kills;ui.endTime.textContent='用时：'+Math.floor(elapsed)+' 秒';}
  function updateHud(){if(!player)return;ui.hp.textContent=Math.ceil(player.hp)+' / '+player.maxHp;ui.bar.style.width=(player.hp/player.maxHp*100)+'%';ui.kills.textContent=kills+' / '+TARGET_KILLS;ui.ammo.textContent=ammo+' / '+reserve;}
  function spawnEnemy(){
    let x,y;const side=Math.floor(Math.random()*4);if(side===0){x=rand(20,W-20);y=20;}else if(side===1){x=W-20;y=rand(100,H-20);}else if(side===2){x=rand(20,W-20);y=H-20;}else{x=20;y=rand(100,H-20);}
    enemies.push({x,y,r:12,hp:2,maxHp:2,speed:rand(45,68),attack:0,flash:0});
  }
  function blocked(x,y,r){return obstacles.some(o=>x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.h);}
  function moveEntity(e,dx,dy,r){let nx=clamp(e.x+dx,r,W-r),ny=clamp(e.y+dy,r,H-r);if(!blocked(nx,e.y,r))e.x=nx;if(!blocked(e.x,ny,r))e.y=ny;}
  function shoot(){if(state!=='playing'||reloadClock>0||shootClock>0)return;if(ammo<=0){if(reserve>0)reload();return;}ammo--;shootClock=.19;const a=player.angle;bullets.push({x:player.x+Math.cos(a)*18,y:player.y+Math.sin(a)*18,vx:Math.cos(a)*520,vy:Math.sin(a)*520,r:3,life:.75});for(let i=0;i<3;i++)particles.push({x:player.x+Math.cos(a)*20,y:player.y+Math.sin(a)*20,vx:rand(-45,45)+Math.cos(a)*rand(30,100),vy:rand(-45,45)+Math.sin(a)*rand(30,100),life:rand(.06,.15),max:.15,color:'#ffd27a',r:rand(1,3)});updateHud();}
  function reload(){if(state!=='playing'||reloadClock>0||ammo===MAG_SIZE||reserve<=0)return;reloadClock=1.05;firing=false;ui.hint.textContent='换弹中…';setTimeout(()=>{if(state==='playing'&&reloadClock>0)ui.hint.textContent='移动：左侧摇杆 · 射击：右侧按钮';},1100);}
  function damagePlayer(amount){if(player.invuln>0)return;player.hp=Math.max(0,player.hp-amount);player.invuln=.45;damageFlash=.16;for(let i=0;i<8;i++)particles.push({x:player.x,y:player.y,vx:rand(-100,100),vy:rand(-100,100),life:.25,max:.25,color:'#ff6868',r:rand(2,4)});updateHud();if(player.hp<=0)end(false);}
  function update(dt){if(state!=='playing')return;elapsed+=dt;shootClock=Math.max(0,shootClock-dt);player.invuln=Math.max(0,player.invuln-dt);damageFlash=Math.max(0,damageFlash-dt);if(reloadClock>0){reloadClock-=dt;if(reloadClock<=0){const n=Math.min(MAG_SIZE-ammo,reserve);ammo+=n;reserve-=n;reloadClock=0;ui.hint.textContent='移动：左侧摇杆 · 射击：右侧按钮';updateHud();}}
    let dx=joy.dx,dy=joy.dy;if(keys.has('w')||keys.has('arrowup'))dy-=1;if(keys.has('s')||keys.has('arrowdown'))dy+=1;if(keys.has('a')||keys.has('arrowleft'))dx-=1;if(keys.has('d')||keys.has('arrowright'))dx+=1;const mag=Math.hypot(dx,dy);if(mag>1){dx/=mag;dy/=mag;}moveEntity(player,dx*player.speed*dt,dy*player.speed*dt,player.r);
    if(mouseAim){player.angle=Math.atan2(mouseAim.y-player.y,mouseAim.x-player.x);}else if(Math.hypot(dx,dy)>.12){player.angle=Math.atan2(dy,dx);}else if(enemies.length){let near=enemies.reduce((a,b)=>Math.hypot(a.x-player.x,a.y-player.y)<Math.hypot(b.x-player.x,b.y-player.y)?a:b);player.angle=Math.atan2(near.y-player.y,near.x-player.x);}
    if(firing)shoot();spawnClock-=dt;if(spawnClock<=0&&enemies.length<6&&kills<TARGET_KILLS){spawnEnemy();spawnClock=rand(.75,1.35);}
    for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.life<=0||b.x<0||b.x>W||b.y<0||b.y>H||blocked(b.x,b.y,b.r)){bullets.splice(i,1);continue;}let hit=false;for(let j=enemies.length-1;j>=0;j--){let e=enemies[j];if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+b.r){e.hp--;e.flash=.09;hit=true;for(let k=0;k<4;k++)particles.push({x:b.x,y:b.y,vx:rand(-70,70),vy:rand(-70,70),life:.2,max:.2,color:'#e9c47b',r:2});if(e.hp<=0){enemies.splice(j,1);kills++;for(let k=0;k<10;k++)particles.push({x:e.x,y:e.y,vx:rand(-110,110),vy:rand(-110,110),life:.35,max:.35,color:'#e66b5b',r:rand(2,4)});updateHud();if(kills>=TARGET_KILLS){end(true);return;}}break;}}if(hit)bullets.splice(i,1);}
    for(const e of enemies){e.flash=Math.max(0,e.flash-dt);e.attack-=dt;const a=Math.atan2(player.y-e.y,player.x-e.x),dist=Math.hypot(player.x-e.x,player.y-e.y);if(dist>e.r+player.r+2)moveEntity(e,Math.cos(a)*e.speed*dt,Math.sin(a)*e.speed*dt,e.r);else if(e.attack<=0){damagePlayer(9);e.attack=.8;}}
    for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;p.life-=dt;if(p.life<=0)particles.splice(i,1);}
  }
  function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#14232a';ctx.fillRect(0,0,W,H);const grid=36;ctx.strokeStyle='#a4c4c414';ctx.lineWidth=1;ctx.beginPath();for(let x=0;x<W;x+=grid){ctx.moveTo(x,0);ctx.lineTo(x,H);}for(let y=0;y<H;y+=grid){ctx.moveTo(0,y);ctx.lineTo(W,y);}ctx.stroke();
    // cover / obstacles
    for(const o of obstacles){ctx.fillStyle='#263941';ctx.fillRect(o.x,o.y,o.w,o.h);ctx.strokeStyle='#52666e';ctx.strokeRect(o.x+.5,o.y+.5,o.w-1,o.h-1);ctx.fillStyle='#3b5159';ctx.fillRect(o.x+5,o.y+5,o.w-10,4);}
    // bullets
    for(const b of bullets){ctx.fillStyle='#ffe49a';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();}
    // enemies
    for(const e of enemies){ctx.fillStyle=e.flash>0?'#fff':'#d65e55';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#351e22';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.x+Math.cos(Math.atan2(player.y-e.y,player.x-e.x))*16,e.y+Math.sin(Math.atan2(player.y-e.y,player.x-e.x))*16);ctx.stroke();ctx.fillStyle='#4b2427';ctx.fillRect(e.x-13,e.y-20,26,4);ctx.fillStyle='#f08a7f';ctx.fillRect(e.x-13,e.y-20,26*(e.hp/e.maxHp),4);}
    if(player){ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.angle);ctx.fillStyle='#dce8ef';ctx.beginPath();ctx.arc(0,0,player.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#b6e35a';ctx.fillRect(0,-4,23,8);ctx.fillStyle='#53636d';ctx.fillRect(-5,-7,9,14);ctx.restore();if(player.invuln>0&&Math.floor(performance.now()/70)%2===0){ctx.strokeStyle='#ff6868';ctx.lineWidth=3;ctx.beginPath();ctx.arc(player.x,player.y,player.r+5,0,Math.PI*2);ctx.stroke();}}
    for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;
    if(damageFlash>0){ctx.fillStyle=`rgba(255,30,30,${damageFlash*1.6})`;ctx.fillRect(0,0,W,H);}
    if(state==='menu'){ctx.fillStyle='#b6e35a';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText('训练区域 · 等待行动指令',W/2,H*.25);}
  }
  function loop(now){if(state!=='playing'){draw();return;}const dt=Math.min((now-last)/1000,.033);last=now;update(dt);draw();if(state==='playing')requestAnimationFrame(loop);else draw();}
  function joyPoint(e){const r=$('joystick').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=38,m=Math.hypot(dx,dy);if(m>max){dx=dx/m*max;dy=dy/m*max;}joy.dx=dx/max;joy.dy=dy/max;$('stick').style.transform=`translate(${dx}px,${dy}px)`;}
  const joystick=$('joystick');joystick.addEventListener('pointerdown',e=>{if(state!=='playing')return;e.preventDefault();joy.active=true;joy.id=e.pointerId;joystick.setPointerCapture(e.pointerId);joyPoint(e);});joystick.addEventListener('pointermove',e=>{if(joy.active&&e.pointerId===joy.id)joyPoint(e);});function stopJoy(e){if(joy.active&&(e.pointerId===undefined||e.pointerId===joy.id)){joy.active=false;joy.id=null;joy.dx=joy.dy=0;$('stick').style.transform='translate(0px,0px)';}}joystick.addEventListener('pointerup',stopJoy);joystick.addEventListener('pointercancel',stopJoy);joystick.addEventListener('lostpointercapture',stopJoy);
  const fire=$('fire');fire.addEventListener('pointerdown',e=>{if(state!=='playing')return;e.preventDefault();firing=true;fire.setPointerCapture(e.pointerId);shoot();});fire.addEventListener('pointerup',()=>firing=false);fire.addEventListener('pointercancel',()=>firing=false);fire.addEventListener('lostpointercapture',()=>firing=false);$('reload').addEventListener('pointerdown',e=>{e.preventDefault();reload();});
  canvas.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&state==='playing'){const r=canvas.getBoundingClientRect();mouseAim={x:e.clientX-r.left,y:e.clientY-r.top};}});canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&state==='playing'){const r=canvas.getBoundingClientRect();mouseAim={x:e.clientX-r.left,y:e.clientY-r.top};firing=true;}});window.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')firing=false;});
  window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys.add(k);if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if(k==='r')reload();if(k===' '&&state==='playing')firing=true;});window.addEventListener('keyup',e=>{keys.delete(e.key.toLowerCase());if(e.key===' ')firing=false;});window.addEventListener('blur',()=>{keys.clear();firing=false;stopJoy({});});window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden){firing=false;keys.clear();stopJoy({});}});
  $('startBtn').addEventListener('click',start);$('againBtn').addEventListener('click',start);$('menuBtn').addEventListener('click',()=>{state='menu';ui.end.classList.add('hidden');ui.start.classList.remove('hidden');ui.hud.classList.add('hidden');ui.controls.classList.add('hidden');draw();});
  resize();draw();
})();
</script>
</body>
</html>
