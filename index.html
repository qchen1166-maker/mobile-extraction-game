<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#101612"><title>撤离行动 FPS 原型 v0.1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18201b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;touch-action:none}#game{position:fixed;inset:0}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none}.panel{background:#101812c9;border:1px solid #ffffff45;border-radius:9px;padding:8px 10px;text-shadow:0 1px 3px #000}#top{position:absolute;top:calc(env(safe-area-inset-top) + 9px);left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;font-size:12px}#mission{font-size:10px;letter-spacing:1.4px;color:#c4e6a8;font-weight:800}#ammo{text-align:right}#ammo strong{font-size:23px}#cross{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-size:23px;text-shadow:0 1px 4px #000}#hint{position:absolute;top:90px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap;text-shadow:0 1px 4px #000}#joy{pointer-events:auto;position:absolute;left:18px;bottom:calc(env(safe-area-inset-bottom) + 25px);width:120px;height:120px;border-radius:50%;border:1px solid #ffffff65;background:#10181266}#stick{position:absolute;left:35px;top:35px;width:48px;height:48px;border-radius:50%;background:#dce7d555;border:1px solid #ffffff80}.btn{pointer-events:auto;position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:#101812cc;border:1px solid #ffffff70;touch-action:none}#fire{right:20px;bottom:calc(env(safe-area-inset-bottom) + 34px);width:78px;height:78px;background:#792b24d9}#reload{right:108px;bottom:calc(env(safe-area-inset-bottom) + 50px);width:54px;height:54px}#sprint{right:30px;bottom:calc(env(safe-area-inset-bottom) + 125px);width:52px;height:52px}#screen{position:fixed;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;padding:22px;background:#080d0bea}.dialog{width:min(430px,100%);padding:23px;border:1px solid #b9d4ad55;border-radius:15px;background:#121a15}.eyebrow{font-size:11px;letter-spacing:2px;color:#c4e6a8;font-weight:800}h1{font-size:28px;line-height:1.15;margin:12px 0}.sub{font-size:13px;line-height:1.7;color:#c6d0c7}.features{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.features div{background:#ffffff0a;border:1px solid #ffffff1b;border-radius:7px;padding:10px;font-size:12px}button{width:100%;padding:14px;margin-top:8px;border:0;border-radius:8px;background:#b9d99b;color:#172016;font-weight:900;font-size:15px}.small{font-size:10px;color:#94a296;line-height:1.55;margin-top:12px}.hidden{display:none!important}#toast{position:absolute;top:62%;left:50%;transform:translateX(-50%);background:#101812dd;padding:8px 12px;border-radius:8px;font-size:12px;opacity:0}
</style></head><body><div id="game"></div><div id="hud"><div id="top"><div class="panel"><div id="mission">OPERATION · TEST RANGE</div><div style="margin-top:4px">生命 <span id="hp">100</span>　目标 <span id="kills">0</span>/5<br>状态：<span id="state">待命</span></div></div><div class="panel" id="ammo">ASSAULT RIFLE<br><strong id="mag">30</strong> / <span id="reserve">90</span><br><span id="rstate">5.56 × 45</span></div></div><div id="cross">+</div><div id="hint">左侧移动 · 右侧拖动视角 · 点击开火</div><div id="joy"><div id="stick"></div></div><div class="btn" id="fire">开火</div><div class="btn" id="reload">换弹</div><div class="btn" id="sprint">冲刺</div><div id="toast"></div></div>
<div id="screen"><div class="dialog"><div class="eyebrow">MOBILE FPS PROTOTYPE · V0.1</div><h1>撤离行动<br>第一人称测试场</h1><div class="sub">第一版可操作 3D 原型：移动、转向、射击、弹药管理，并与 AI 靶敌交战。</div><div class="features"><div>▰ 第一人称 3D 场景</div><div>◉ 触屏移动与视角</div><div>⌁ 枪械 / 弹匣 / 换弹</div><div>⚑ AI 敌人与生命值</div></div><button id="start">进入测试场</button><div class="small">建议横屏游玩并保持网络连接。当前为单机原型，尚无真实多人联机、背包、物资搜刮或撤离存档。</div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const root=document.querySelector('#game'),scene=new THREE.Scene();scene.background=new THREE.Color(0x87958e);scene.fog=new THREE.Fog(0x87958e,25,100);
const camera=new THREE.PerspectiveCamera(76,innerWidth/innerHeight,.08,180);camera.position.set(0,1.7,12);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd8e2d7,0x49483d,2));const sun=new THREE.DirectionalLight(0xffe4c2,2.2);sun.position.set(-15,25,10);scene.add(sun);
const material=(c,r=.85,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const concrete=material(0x666d68),dark=material(0x292f2c),sand=material(0x88816c),metal=material(0x444b49,.5,.5),rust=material(0x654b3b),green=material(0x46584a),black=material(0x141817,.45,.4);
function box(x,y,z,a,b,c,m){let o=new THREE.Mesh(new THREE.BoxGeometry(a,b,c),m);o.position.set(x,y,z);o.receiveShadow=true;scene.add(o);return o}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(180,180),material(0x555b52));floor.rotation.x=-Math.PI/2;floor.position.y=-.08;scene.add(floor);
for(let x=-40;x<=40;x+=4)box(x,0,0,.035,.01,90,material(0x6b7068));for(let z=-40;z<=40;z+=4)box(0,0,z,90,.01,.035,material(0x6b7068));
box(0,5,-43,90,10,1,concrete);box(-45,5,0,1,10,86,concrete);box(45,5,0,1,10,86,concrete);
for(let i=0;i<8;i++){let z=-30+i*8;box(-19,2.3,z,5,4.6,3,concrete);box(18,1.8,z+2,4,3.6,4,dark);box(0,1.25,z-3,3.5,2.5,2.5,sand)}
for(let i=0;i<13;i++){let x=-36+i*6;box(x,1.4,-12,2.4,2.8,1.1,i%2?green:rust);box(x,1.42,-11.4,2.1,.12,.08,metal)}
for(let i=0;i<8;i++){let x=-32+i*9;box(x,1.2,27,3.5,2.4,2.4,dark);box(x,2.45,27,3.4,.12,2.3,metal)}
for(let i=0;i<10;i++)box(-34+i*7.5,2.3,39,4,4.6,.5,concrete);
const weapon=new THREE.Group();camera.add(weapon);let part=new THREE.Mesh(new THREE.BoxGeometry(.22,.2,.62),dark);part.position.set(.32,-.28,-.68);weapon.add(part);part=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,.65,10),metal);part.rotation.x=Math.PI/2;part.position.set(.32,-.24,-1.13);weapon.add(part);part=new THREE.Mesh(new THREE.BoxGeometry(.15,.16,.32),green);part.position.set(.32,-.29,-.28);weapon.add(part);part=new THREE.Mesh(new THREE.BoxGeometry(.1,.22,.13),black);part.position.set(.32,-.42,-.59);weapon.add(part);scene.add(camera);
let yaw=0,pitch=0,playing=false,hp=100,mag=30,reserve=90,kills=0,reloading=false,sprinting=false,lastShot=0,fireHeld=false;
const enemies=[],enemyMat=material(0x3b493d),vestMat=material(0x242b27),skin=material(0x8c735b),helmet=material(0x46584a);
function makeEnemy(x,z){let g=new THREE.Group();g.position.set(x,0,z);let o=new THREE.Mesh(new THREE.BoxGeometry(.62,.82,.34),enemyMat);o.position.y=1.15;g.add(o);o=new THREE.Mesh(new THREE.BoxGeometry(.66,.55,.37),vestMat);o.position.set(0,1.18,-.01);g.add(o);o=new THREE.Mesh(new THREE.SphereGeometry(.22,12,10),skin);o.position.y=1.78;g.add(o);o=new THREE.Mesh(new THREE.SphereGeometry(.235,12,8,0,Math.PI*2,0,Math.PI/2),helmet);o.position.y=1.86;g.add(o);for(const s of [-1,1]){o=new THREE.Mesh(new THREE.BoxGeometry(.22,.65,.25),dark);o.position.set(s*.18,.42,0);g.add(o);o=new THREE.Mesh(new THREE.BoxGeometry(.18,.65,.2),enemyMat);o.position.set(s*.42,1.18,-.04);g.add(o)}o=new THREE.Mesh(new THREE.BoxGeometry(.12,.12,.72),black);o.position.set(.32,1.1,-.35);g.add(o);scene.add(g);enemies.push({group:g,alive:true,hp:100,attack:0})}
function spawn(){for(const e of enemies)scene.remove(e.group);enemies.length=0;[[-7,-16],[8,-22],[2,-31],[-13,1],[14,8]].forEach(p=>makeEnemy(...p))}
const $=id=>document.getElementById(id);function hud(){$('hp').textContent=hp;$('kills').textContent=kills;$('mag').textContent=mag;$('reserve').textContent=reserve;$('state').textContent=hp<=0?'倒地':reloading?'换弹中':sprinting?'冲刺':'交战';$('rstate').textContent=reloading?'换弹中…':'5.56 × 45'}
let toastTimer;function toast(s){$('toast').textContent=s;$('toast').style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.opacity=0,1100)}
function end(win){playing=false;fireHeld=false;$('screen').classList.remove('hidden');$('screen').innerHTML='<div class="dialog"><div class="eyebrow">TEST REPORT</div><h1>'+(win?'测试场清空':'任务失败')+'</h1><div class="sub">'+(win?'已清除全部目标。生命值：'+hp+'。':'生命值归零，已清除 '+kills+'/5 个目标。')+'</div><button id="restart">重新开始</button></div>';$('restart').onclick=reset}
function reset(){hp=100;mag=30;reserve=90;kills=0;reloading=false;camera.position.set(0,1.7,12);yaw=0;pitch=0;camera.rotation.set(0,0,0);weapon.position.set(0,0,0);spawn();hud();$('screen').classList.add('hidden');playing=true;toast('任务开始：清除 5 个目标')}
function reload(){if(!playing||reloading||mag===30||reserve<=0)return;reloading=true;hud();setTimeout(()=>{if(!playing)return;let n=Math.min(30-mag,reserve);mag+=n;reserve-=n;reloading=false;hud();toast('换弹完成')},1250)}
const ray=new THREE.Raycaster();function shoot(){if(!playing||reloading||hp<=0)return;let now=performance.now();if(now-lastShot<180)return;lastShot=now;if(mag<=0){toast('弹匣已空，请换弹');return}mag--;hud();weapon.position.z=.06;setTimeout(()=>weapon.position.z=0,65);ray.setFromCamera(new THREE.Vector2(0,0),camera);let targets=[];enemies.forEach(e=>{if(e.alive)e.group.traverse(o=>{if(o.isMesh)targets.push(o)})});let hits=ray.intersectObjects(targets,false);if(hits.length){let e=enemies.find(e=>e.alive&&e.group===hits[0].object.parent);if(!e)e=enemies.find(e=>e.alive&&e.group.children.includes(hits[0].object));if(e){e.hp-=50;if(e.hp<=0){e.alive=false;scene.remove(e.group);kills++;hud();toast('目标清除');if(kills>=5)end(true)}}}}
$('start').onclick=()=>{reset()};$('fire').addEventListener('pointerdown',e=>{e.preventDefault();fireHeld=true;shoot()});['pointerup','pointercancel','pointerleave'].forEach(ev=>$('fire').addEventListener(ev,()=>fireHeld=false));$('reload').addEventListener('pointerdown',e=>{e.preventDefault();reload()});$('sprint').addEventListener('pointerdown',e=>{e.preventDefault();sprinting=true;hud()});['pointerup','pointercancel','pointerleave'].forEach(ev=>$('sprint').addEventListener(ev,()=>{sprinting=false;hud()}));
const joy=$('joy'),stick=$('stick');let joyId=null,jx=0,jy=0;function setStick(e){let r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy),max=42;if(len>max){dx=dx/len*max;dy=dy/len*max}jx=dx/max;jy=dy/max;stick.style.transform=`translate(${dx}px,${dy}px)`}joy.addEventListener('pointerdown',e=>{e.preventDefault();joyId=e.pointerId;joy.setPointerCapture(joyId);setStick(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)setStick(e)});function release(e){if(e.pointerId===joyId){joyId=null;jx=jy=0;stick.style.transform='translate(0,0)'}}joy.addEventListener('pointerup',release);joy.addEventListener('pointercancel',release);
let lookId=null,lx=0,ly=0;renderer.domElement.addEventListener('pointerdown',e=>{if(!playing||e.clientX<innerWidth*.38)return;lookId=e.pointerId;lx=e.clientX;ly=e.clientY;renderer.domElement.setPointerCapture(lookId)});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;let dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;yaw-=dx*.0042;pitch=Math.max(-1.15,Math.min(1.15,pitch-dy*.0035));camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch});function endLook(e){if(e.pointerId===lookId)lookId=null}renderer.domElement.addEventListener('pointerup',endLook);renderer.domElement.addEventListener('pointercancel',endLook);addEventListener('keydown',e=>{if(e.code==='Space')shoot();if(e.code==='KeyR')reload();if(e.code==='ShiftLeft')sprinting=true});addEventListener('keyup',e=>{if(e.code==='ShiftLeft')sprinting=false});
const clock=new THREE.Clock();let flash=0;function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04);if(playing&&hp>0){if(fireHeld)shoot();let speed=(sprinting?7.2:4.3)*dt,forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));camera.position.addScaledVector(forward,-jy*speed);camera.position.addScaledVector(right,jx*speed);camera.position.x=Math.max(-41,Math.min(41,camera.position.x));camera.position.z=Math.max(-40,Math.min(42,camera.position.z));camera.position.y=1.7;weapon.position.y=Math.sin(performance.now()*.008)*(Math.abs(jx)+Math.abs(jy))*.006;enemies.forEach(e=>{if(!e.alive)return;let dx=camera.position.x-e.group.position.x,dz=camera.position.z-e.group.position.z,d=Math.hypot(dx,dz);if(d>2.8){e.group.position.x+=dx/d*dt*.72;e.group.position.z+=dz/d*dt*.72;e.group.rotation.y=Math.atan2(dx,dz)}else{e.attack+=dt;if(e.attack>1.35){e.attack=0;hp=Math.max(0,hp-7);flash=.22;$('hud').style.filter='drop-shadow(0 0 10px #a22)';hud();if(hp<=0)end(false)}}});if(flash>0){flash-=dt;if(flash<=0)$('hud').style.filter='none'}}renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5))});spawn();hud();
</script></body></html>
